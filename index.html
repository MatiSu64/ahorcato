<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>catto</title>

<style>
body{
    background:#ffffff;
    margin:0;
    padding:10px;
}

#ahorcato-container{
    font-family:sans-serif;
    text-align:center;
    background:#bdbdbd;
    width:99%;
    max-width:none;
    min-height:1400px;
    margin:10px auto;
    padding:100px;
    border-radius:35px;
    box-sizing:border-box;
}

.oculto{
    display:none;
}

#logo-catto{
    width:800px;
    max-width:90%;
    border-radius:50%;
    margin-bottom:40px;
}

h2{
    font-size:10em;
    margin:20px 0;
}

.traduccion{
    font-size:4em;
    margin-bottom:50px;
}

#palabra-display{
    font-size:18em;
    letter-spacing:20px;
    margin:80px 0;
    font-weight:bold;
}

input{
    width:400px;
    height:280px;
    font-size:10em;
    text-align:center;
    border-radius:25px;
    border:4px solid #666;
    margin:20px;
}

button{
    cursor:pointer;
    min-width:800px;
    min-height:200px;
    padding:50px 100px;
    font-size:6em;
    background:#6200ea;
    color:white;
    border:none;
    border-radius:25px;
}

#mensajes{
    font-size:5em;
    margin-top:50px;
}

/* 🔥 NUEVO: letras usadas */
#letras-usadas{
    font-size:4em;
    margin-top:40px;
    color:#333;
}

/* Ajuste para pantallas más pequeñas */
@media (max-width: 1000px){

    #ahorcato-container{
        min-height:100vh;
        padding:40px;
    }

    #logo-catto{
        width:450px;
    }

    h2{
        font-size:4em;
    }

    .traduccion{
        font-size:2em;
    }

    #palabra-display{
        font-size:7em;
        letter-spacing:10px;
    }

    input{
        width:180px;
        height:140px;
        font-size:5em;
    }

    button{
        min-width:350px;
        min-height:110px;
        font-size:2.5em;
    }

    #mensajes{
        font-size:2.5em;
    }

    #letras-usadas{
        font-size:2em;
    }
}
</style>
</head>

<body>

<div id="ahorcato-container">

    <div id="menu">
        <img id="logo-catto" src="catto.png" alt="Logo Catto">

        <h2>Welcome to Ahorcato!</h2>

        <p class="traduccion">
            (¡Bienvenido a Ahorcato!)
        </p>

        <button onclick="iniciarJuego()">
            Start Game (Empezar)
        </button>

       
    </div>

    <div id="juego" class="oculto">

        <div id="palabra-display"></div>

        <input type="text" id="letra" maxlength="1" placeholder="Letter">

        <button onclick="adivinar()">
            Guess (Adivinar)
        </button>

        <p id="mensajes">
            Attempts left (Intentos):
            <span id="intentos">15</span>
        </p>

        <!-- 🔥 NUEVO: letras usadas -->
        <p id="letras-usadas">
            Letters used (Letras usadas): <span id="usadas"></span>
        </p>

    </div>

</div>

<script>
const palabras = [
    "apple","beach","bread","chair","cloud","dance","dream","earth","field","fruit",
    "ghost","glass","green","happy","heart","house","juice","light","lunch","music",
    "night","ocean","party","phone","piano","pizza","plant","radio","river","sheep",
    "smile","space","spoon","storm","sugar","table","teeth","tiger","touch","train",
    "water","whale","world","write","young","zebra","angel","angry","birds","black",
    "blood","board","brain","brown","build","candy","check","child","clean","clock",
    "cloth","coach","coast","color","count","court","cover","cross","daily","death",
    "depth","drink","drive","early","empty","entry","event","extra","faith","false",
    "fault","field","fight","final","floor","focus","force","frame","front","funny",
    "giant","given","glass","glove","going","grade","grand","grass","great","green",
    "group","guard","guest","guide","habit","happy","heavy","hello","honey","horse",
    "hotel","house","human","ideal","image","index","inner","input","issue","joint",
    "judge","knife","known","label","large","later","laugh","layer","learn","least",
    "level","light","limit","liver","local","logic","loose","lower","lucky","lunch",
    "magic","major","maker","march","match","maybe","mayor","media","metal","meter",
    "might","minor","money","month","moral","motor","mount","mouse","mouth","movie",
    "music","night","noise","north","novel","nurse","ocean","offer","often","order",
    "other","outer","paint","panel","paper","party","peace","phase","phone","piece",
    "pilot","pitch","place","plain","plane","plant","plate","point","pound","power"
];

let palabraSeleccionada = "";
let letrasAdivinadas = [];
let letrasUsadas = [];
let intentos = 15;

function iniciarJuego() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("juego").style.display = "block";

    palabraSeleccionada =
        palabras[Math.floor(Math.random() * palabras.length)];

    letrasAdivinadas = [];
    letrasUsadas = [];
    intentos = 15;

    document.getElementById("intentos").innerText = intentos;
    document.getElementById("usadas").innerText = "";

    actualizarDisplay();
}

function actualizarDisplay() {
    let display = palabraSeleccionada
        .split("")
        .map(l => letrasAdivinadas.includes(l) ? l : "_")
        .join(" ");

    document.getElementById("palabra-display").innerText = display;
}

function adivinar() {

    let input = document.getElementById("letra");
    let letra = input.value.toLowerCase();

    if (letra && /^[a-z]$/.test(letra)) {

        if (!letrasUsadas.includes(letra)) {
            letrasUsadas.push(letra);
        }

        document.getElementById("usadas").innerText =
            letrasUsadas.join(" ");

        if (palabraSeleccionada.includes(letra)) {

            if (!letrasAdivinadas.includes(letra)) {
                letrasAdivinadas.push(letra);
            }

        } else {

            intentos--;
            document.getElementById("intentos").innerText = intentos;
        }
    }

    input.value = "";

    actualizarDisplay();

    if (!document.getElementById("palabra-display").innerText.includes("_")) {

        alert("You win! (¡Ganaste!)");
        location.reload();

    } else if (intentos <= 0) {

        alert(
            "Game over! The word was: " +
            palabraSeleccionada +
            " (Fin del juego, la palabra era: " +
            palabraSeleccionada + ")"
        );

        location.reload();
    }
}
</script>

</body>
</html>
